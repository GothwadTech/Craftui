[package]
name = "craftui-example-whiteboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "craftui_example_whiteboard"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "craftui-whiteboard"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["craftui/desktop"]

[lints]
workspace = true

[dependencies]
craftui = { workspace = true, default-features = false, features = [
    "dsl",
    "embedded-fallback-font",
    "gpu-sdf",
    "gpu-vello",
    "cpu-vello",
    "cpu-tiny-skia",
] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
craftui = { workspace = true, default-features = false, features = ["android", "hot-reload"] }
jni.workspace = true
ndk-context.workspace = true

[build-dependencies]
craftui-dsl.workspace = true
