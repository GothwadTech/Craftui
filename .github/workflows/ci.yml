name: CraftUI CI

# Pull requests run the Tier 1 targets (Linux desktop, Web/WASM, Android).
# The slower and more expensive Windows and macOS runners only run on pushes
# to `main` and on manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` is only used by `.github/scripts/publish-logs.sh`, which
# stores job logs in an unreferenced Git blob. See that script for details.
permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  GH_TOKEN: ${{ github.token }}

jobs:
  license-guard:
    name: License purity (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependency licenses
        run: .github/scripts/logged.sh deny cargo deny check licenses
      - name: Publish logs
        if: ${{ always() }}
        run: .github/scripts/publish-logs.sh license-guard

  lockfile:
    name: Cargo.lock is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Re-resolve and compare with the committed lockfile
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          cargo metadata --format-version 1 >/dev/null
          cp Cargo.lock "$RUNNER_TEMP/ci-logs/Cargo.lock"
          .github/scripts/logged.sh lockfile-diff git diff --exit-code --stat -- Cargo.lock
      - name: Publish logs
        if: ${{ always() }}
        run: .github/scripts/publish-logs.sh lockfile

  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libx11-dev
      - name: Format check
        run: .github/scripts/logged.sh fmt cargo fmt --all -- --check
      - name: Save the formatting patch
        if: ${{ failure() }}
        run: |
          cargo fmt --all
          git diff >"$RUNNER_TEMP/ci-logs/fmt.patch"
          git checkout -- .
      - name: Clippy report (all warnings, never fails on lints)
        if: ${{ !cancelled() }}
        run: .github/scripts/logged.sh clippy-report cargo clippy --locked --workspace --all-targets
      - name: Clippy (deny warnings)
        if: ${{ !cancelled() }}
        run: .github/scripts/logged.sh clippy cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        run: .github/scripts/logged.sh test cargo test --locked --workspace
      - name: Minimal-feature compile check
        if: ${{ !cancelled() }}
        run: .github/scripts/logged.sh minimal cargo check --locked -p craftui --no-default-features --features "desktop,dsl,hot-reload,embedded-fallback-font,gpu-sdf"
      - name: Publish logs
        if: ${{ always() }}
        run: .github/scripts/publish-logs.sh linux

  desktop-matrix:
    name: Test & Clippy (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo test --workspace

  wasm:
    name: Web WASM (clippy, minimal check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy report (all warnings, never fails on lints)
        run: .github/scripts/logged.sh clippy-report cargo clippy --locked -p craftui-platform-web --target wasm32-unknown-unknown
      - name: Clippy (deny warnings)
        if: ${{ !cancelled() }}
        run: .github/scripts/logged.sh clippy cargo clippy --locked -p craftui-platform-web --target wasm32-unknown-unknown -- -D warnings
      - name: Minimal-feature check
        if: ${{ !cancelled() }}
        run: .github/scripts/logged.sh minimal cargo check --locked -p craftui-platform-web --target wasm32-unknown-unknown --no-default-features --features gpu-sdf
      - name: Publish logs
        if: ${{ always() }}
        run: .github/scripts/publish-logs.sh wasm

  android:
    name: Android (clippy, minimal check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Point cargo at the preinstalled NDK
        run: |
          NDK_BIN="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=${NDK_BIN}/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_BIN}/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"
      - name: Clippy report (all warnings, never fails on lints)
        run: .github/scripts/logged.sh clippy-report cargo clippy --locked -p craftui-platform-android --target aarch64-linux-android
      - name: Clippy (deny warnings)
        if: ${{ !cancelled() }}
        run: .github/scripts/logged.sh clippy cargo clippy --locked -p craftui-platform-android --target aarch64-linux-android -- -D warnings
      - name: Minimal-feature check
        if: ${{ !cancelled() }}
        run: .github/scripts/logged.sh minimal cargo check --locked -p craftui-platform-android --target aarch64-linux-android --no-default-features --features gpu-sdf
      - name: Publish logs
        if: ${{ always() }}
        run: .github/scripts/publish-logs.sh android

  bench-smoke:
    name: Benchmark smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libx11-dev
      - name: Run perf suite smoke benchmark
        run: |
          .github/scripts/logged.sh bench-build cargo bench --locked -p craftui --bench perf_suite --no-run
          cargo bench --locked -p craftui --bench perf_suite -- --quick --json > bench-smoke.json
          cp bench-smoke.json "$RUNNER_TEMP/ci-logs/bench-smoke.json"
          python3 -m json.tool bench-smoke.json > /dev/null
      - name: Publish logs
        if: ${{ always() }}
        run: .github/scripts/publish-logs.sh bench-smoke
