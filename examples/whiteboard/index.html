<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Whiteboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #craftui-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      outline: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 15px;
      color: #6c757d;
      background: #ffffff;
      z-index: 100;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div style="font-weight: 600; color: #1e1e1e; font-size: 20px;">Whiteboard</div>
    <div>Loading CraftUI WebAssembly Engine...</div>
  </div>
  <canvas id="craftui-canvas" tabindex="0"></canvas>
  <script type="module">
    import init from "./pkg/craftui_example_whiteboard.js";
    async function run() {
      try {
        await init();
        const loader = document.getElementById("loading");
        if (loader) loader.remove();
      } catch (err) {
        console.error("Failed to start Whiteboard:", err);
        const loader = document.getElementById("loading");
        if (loader) {
          loader.innerHTML = '<div style="color:#e03131;font-weight:bold;">Failed to launch Whiteboard WebAssembly:</div><pre style="margin-top:8px;font-size:12px;">' + err + '</pre>';
        }
      }
    }
    run();
  </script>
</body>
</html>
