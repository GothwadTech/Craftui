<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>CraftUI Notes</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #craftui-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      outline: none;
    }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 15px;
      color: #5f6368;
      background: #ffffff;
    }
    #status.error {
      color: #b3261e;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="craftui-canvas" tabindex="0"></canvas>
  <div id="status" role="status">Loading CraftUI Notes…</div>
  <!--
    `craftui build --platform web` writes its own index.html next to
    craftui_app.js. This copy is for running wasm-bindgen by hand; see README.md.
  -->
  <script type="module">
    const status = document.getElementById("status");
    try {
      const { default: init } = await import("./craftui_app.js");
      await init();
      status.remove();
    } catch (err) {
      console.error(err);
      status.classList.add("error");
      status.textContent = "CraftUI Notes could not start.\n\n" + err;
    }
  </script>
</body>
</html>
