[app]
name = "ScanCraft"
id = "dev.craftui.scancraft"
version = "0.1.0"

[android]
min_sdk = 26
target_sdk = 35
version_code = 1
features = ["android.hardware.camera", "android.hardware.camera.autofocus"]

[ios]
deployment_target = "15.0"
capabilities = ["push-notifications"]

[permissions]
camera = "Required to capture documents, receipts, and whiteboard notes."
photos = "Required to import photos from your device gallery for enhancement."
storage_read = "Required on older Android versions to read saved document scans."
storage_write = "Required on older Android versions to export scanned PDF and image documents."
vibrate = "Provides tactile haptic feedback when a document is successfully captured."
notifications = "Sends alerts when batch document OCR or export completes."
