<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ScanApp — Document Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .teal-glow {
      box-shadow: 0 4px 20px rgba(0, 188, 212, 0.35);
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between selection:bg-teal-500 selection:text-black">

  <!-- Main Content Wrapper -->
  <div class="w-full max-w-md mx-auto px-4 pt-3 pb-24 flex flex-col gap-5">

    <!-- Top App Bar -->
    <header class="flex items-center justify-between w-full py-1">
      <!-- Left: Back to Native & User Profile Avatar -->
      <div class="flex items-center gap-2">
        <button onclick="if(window.craftui_native){window.craftui_native.postMessage(JSON.stringify({cmd:'exit_tauri'}))}" class="px-2.5 py-1 rounded-lg bg-[#1E293B] text-xs font-semibold text-sky-300 hover:bg-slate-700 transition active:scale-95 flex items-center gap-1">
          <span>←</span><span>Native</span>
        </button>
        <button class="w-9 h-9 rounded-full bg-[#0E2938] flex items-center justify-center text-[#00BCD4] hover:opacity-80 transition active:scale-95">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </button>
      </div>

      <!-- Center Logo & Title -->
      <div class="flex items-center gap-2">
        <div class="text-[#00BCD4]">
          <svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="14.31" y1="8" x2="20.05" y2="17.94"/>
            <line x1="9.69" y1="8" x2="21.17" y2="8"/>
            <line x1="7.38" y1="12" x2="13.12" y2="2.06"/>
            <line x1="9.69" y1="16" x2="3.95" y2="6.06"/>
            <line x1="14.31" y1="16" x2="2.83" y2="16"/>
            <line x1="16.62" y1="12" x2="10.88" y2="21.94"/>
          </svg>
        </div>
        <span class="text-xl font-bold tracking-tight text-[#00BCD4]">ScanApp</span>
      </div>

      <!-- Right Header Actions (Theme & Search) -->
      <div class="flex items-center gap-3">
        <button class="text-[#FACC15] hover:opacity-80 transition active:scale-95" title="Toggle Theme">
          <svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <button class="text-white hover:opacity-80 transition active:scale-95" title="Search">
          <svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 8-Tool Action Grid (2 Rows x 4 Columns) -->
    <section class="grid grid-cols-4 gap-y-4 gap-x-2 w-full pt-1">
      
      <!-- 1. Smart Scan -->
      <div onclick="if(window.__TAURI__){window.__TAURI__.core.invoke('capture_photo')}else if(window.craftui_native){window.craftui_native.postMessage(JSON.stringify({cmd:'capture_photo'}))}" class="flex flex-col items-center gap-1.5 cursor-pointer group active:scale-95 transition">
        <div class="w-14 h-14 rounded-full bg-[#0E3B43] flex items-center justify-center text-[#00BCD4] group-hover:scale-105 transition shadow-md">
          <svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <span class="text-xs font-medium text-slate-200 text-center tracking-tight">Smart Scan</span>
      </div>

      <!-- 2. Import Photos -->
      <div onclick="if(window.__TAURI__){window.__TAURI__.core.invoke('import_gallery')}else if(window.craftui_native){window.craftui_native.postMessage(JSON.stringify({cmd:'import_gallery'}))}" class="flex flex-col items-center gap-1.5 cursor-pointer group active:scale-95 transition">
        <div class="w-14 h-14 rounded-full bg-[#1E3A68] flex items-center justify-center text-[#3B82F6] group-hover:scale-105 transition shadow-md">
          <svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
            <line x1="12" y1="7" x2="12" y2="13"/>
            <line x1="9" y1="10" x2="15" y2="10"/>
          </svg>
        </div>
        <span class="text-xs font-medium text-slate-200 text-center tracking-tight">Import Photos</span>
      </div>

      <!-- 3. Import Files -->
      <div onclick="if(window.__TAURI__){window.__TAURI__.core.invoke('import_gallery')}else if(window.craftui_native){window.craftui_native.postMessage(JSON.stringify({cmd:'import_gallery'}))}" class="flex flex-col items-center gap-1.5 cursor-pointer group active:scale-95 transition">
        <div class="w-14 h-14 rounded-full bg-[#452A14] flex items-center justify-center text-[#F97316] group-hover:scale-105 transition shadow-md">
          <svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <path d="M12 11v6M9 14l3-3 3 3"/>
          </svg>
        </div>
        <span class="text-xs font-medium text-slate-200 text-center tracking-tight">Import Files</span>
      </div>

      <!-- 4. ID Card -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer group">
        <div class="w-14 h-14 rounded-full bg-[#0C3C47] flex items-center justify-center text-[#06B6D4] group-hover:scale-105 group-active:scale-95 transition">
          <svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <circle cx="9" cy="10" r="2"/>
            <line x1="15" y1="8" x2="17" y2="8"/>
            <line x1="15" y1="12" x2="17" y2="12"/>
            <line x1="7" y1="16" x2="17" y2="16"/>
          </svg>
        </div>
        <span class="text-xs font-medium text-slate-200 text-center tracking-tight">ID Card</span>
      </div>

      <!-- 5. To Text (OCR) -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer group">
        <div class="w-14 h-14 rounded-full bg-[#3B1A59] flex items-center justify-center text-[#B388FF] font-bold text-lg group-hover:scale-105 group-active:scale-95 transition">
          TT
        </div>
        <span class="text-xs font-medium text-slate-200 text-center tracking-tight">To Text (OCR)</span>
      </div>

      <!-- 6. PDF Tools -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer group">
        <div class="w-14 h-14 rounded-full bg-[#4A151B] flex items-center justify-center text-[#EF4444] group-hover:scale-105 group-active:scale-95 transition">
          <svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <text x="7" y="17" fill="currentColor" font-size="6" font-family="sans-serif" font-weight="bold" stroke="none">PDF</text>
          </svg>
        </div>
        <span class="text-xs font-medium text-slate-200 text-center tracking-tight">PDF Tools</span>
      </div>

      <!-- 7. Watermark -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer group">
        <div class="w-14 h-14 rounded-full bg-[#0E3D38] flex items-center justify-center text-[#10B981] group-hover:scale-105 group-active:scale-95 transition">
          <svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="3"/>
            <path d="M14 9h3v3"/>
            <path d="M7 15l10-10"/>
          </svg>
        </div>
        <span class="text-xs font-medium text-slate-200 text-center tracking-tight">Watermark</span>
      </div>

      <!-- 8. All Tools -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer group">
        <div class="w-14 h-14 rounded-full bg-[#2A303A] flex items-center justify-center text-[#8E95A5] group-hover:scale-105 group-active:scale-95 transition">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/>
            <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
            <circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
          </svg>
        </div>
        <span class="text-xs font-medium text-slate-200 text-center tracking-tight">All Tools</span>
      </div>

    </section>

    <!-- Recent Docs Section Header -->
    <div class="flex items-center justify-between w-full pt-3 pb-1">
      <div>
        <h2 class="text-lg font-bold text-white tracking-tight">Recent Docs</h2>
        <button class="text-xs text-slate-400 flex items-center gap-1 hover:text-white transition">
          <span>All docs (3)</span>
          <svg class="w-3 h-3 fill-current" viewBox="0 0 20 20">
            <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
          </svg>
        </button>
      </div>

      <!-- Right 4 Action Buttons -->
      <div class="flex items-center gap-4 text-slate-400">
        <!-- Add Folder -->
        <button class="hover:text-white transition" title="New Folder">
          <svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
        </button>
        <!-- Sort -->
        <button class="hover:text-white transition" title="Sort">
          <svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
          </svg>
        </button>
        <!-- Grid View -->
        <button class="hover:text-white transition" title="Grid View">
          <svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
        </button>
        <!-- Batch Select -->
        <button class="hover:text-white transition" title="Batch Select">
          <svg class="w-5 h-5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
            <path d="M2 13l4 4L16 7M7 13l4 4L21 7"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Document List (Clean Black Background, Realistic Photo Thumbnails) -->
    <div class="flex flex-col gap-4 w-full">

      <!-- Item 1: Terminal / Code Screen Document -->
      <div class="flex items-center justify-between w-full py-1 group cursor-pointer hover:opacity-90 transition">
        <div class="flex items-center gap-4">
          <!-- Thumbnail with Teal Checkmark Badge -->
          <div class="relative w-16 h-20 rounded-lg overflow-hidden bg-[#1E293B] border border-slate-800 flex-shrink-0">
            <!-- Simulated Code Screen Thumbnail Graphic -->
            <div class="w-full h-full p-1.5 flex flex-col gap-1 bg-[#0D1525]">
              <div class="w-8 h-1.5 bg-sky-400 rounded-sm"></div>
              <div class="w-12 h-1 bg-emerald-400/80 rounded-sm"></div>
              <div class="w-10 h-1 bg-amber-400/80 rounded-sm"></div>
              <div class="w-11 h-1 bg-purple-400/80 rounded-sm"></div>
              <div class="w-7 h-1 bg-slate-500 rounded-sm"></div>
              <div class="w-9 h-1 bg-slate-500 rounded-sm"></div>
            </div>
            <!-- Teal Checkmark Badge -->
            <div class="absolute bottom-1 right-1 w-4 h-4 rounded-full bg-[#00897B] flex items-center justify-center text-white">
              <svg class="w-2.5 h-2.5 stroke-current stroke-3 fill-none" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
          </div>

          <!-- Doc Metadata -->
          <div class="flex flex-col gap-1">
            <h3 class="text-sm font-semibold text-white tracking-tight">New Doc 11-09-2026 21.45</h3>
            <span class="text-xs text-slate-400">09/11/26 21:46</span>
            <div class="flex items-center gap-1.5 text-xs text-slate-400">
              <svg class="w-3.5 h-3.5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
                <rect x="5" y="5" width="13" height="13" rx="1.5"/>
                <path d="M8 5V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-2"/>
              </svg>
              <span>3</span>
            </div>
          </div>
        </div>

        <!-- 3-Dots Menu -->
        <button class="text-slate-400 hover:text-white p-2">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
          </svg>
        </button>
      </div>

      <!-- Item 2: Handwritten Notes on Lined Paper -->
      <div class="flex items-center justify-between w-full py-1 group cursor-pointer hover:opacity-90 transition">
        <div class="flex items-center gap-4">
          <!-- Thumbnail -->
          <div class="relative w-16 h-20 rounded-lg overflow-hidden bg-[#E2E8F0] border border-slate-800 flex-shrink-0">
            <!-- Lined Paper with Simulated Handwriting Graphic -->
            <div class="w-full h-full p-1.5 flex flex-col justify-between bg-[#F8FAFC]">
              <div class="border-b border-blue-200/80 w-full h-2"></div>
              <div class="border-b border-blue-200/80 w-full h-2 flex items-center"><div class="w-8 h-0.5 bg-slate-700/60 rounded"></div></div>
              <div class="border-b border-blue-200/80 w-full h-2 flex items-center"><div class="w-11 h-0.5 bg-slate-700/60 rounded"></div></div>
              <div class="border-b border-blue-200/80 w-full h-2 flex items-center"><div class="w-7 h-0.5 bg-slate-700/60 rounded"></div></div>
              <div class="border-b border-blue-200/80 w-full h-2"></div>
              <div class="border-b border-blue-200/80 w-full h-2 flex items-center"><div class="w-10 h-0.5 bg-slate-700/60 rounded"></div></div>
            </div>
            <!-- Teal Checkmark Badge -->
            <div class="absolute bottom-1 right-1 w-4 h-4 rounded-full bg-[#00897B] flex items-center justify-center text-white">
              <svg class="w-2.5 h-2.5 stroke-current stroke-3 fill-none" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
          </div>

          <!-- Doc Metadata -->
          <div class="flex flex-col gap-1">
            <h3 class="text-sm font-semibold text-white tracking-tight">New Doc 11-09-2026 15.11</h3>
            <span class="text-xs text-slate-400">09/11/26 15:13</span>
            <div class="flex items-center gap-1.5 text-xs text-slate-400">
              <svg class="w-3.5 h-3.5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
                <rect x="5" y="5" width="13" height="13" rx="1.5"/>
                <path d="M8 5V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-2"/>
              </svg>
              <span>9</span>
            </div>
          </div>
        </div>

        <button class="text-slate-400 hover:text-white p-2">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
          </svg>
        </button>
      </div>

      <!-- Item 3: Colorful Package / Box Document -->
      <div class="flex items-center justify-between w-full py-1 group cursor-pointer hover:opacity-90 transition">
        <div class="flex items-center gap-4">
          <!-- Thumbnail -->
          <div class="relative w-16 h-20 rounded-lg overflow-hidden bg-slate-900 border border-slate-800 flex-shrink-0">
            <!-- Package Box Graphic -->
            <div class="w-full h-full flex flex-col justify-between">
              <div class="h-10 bg-gradient-to-r from-red-600 to-amber-500 p-1 flex items-center justify-center">
                <span class="text-[7px] font-black tracking-widest text-white">SUN</span>
              </div>
              <div class="h-10 bg-[#06B6D4] p-1 flex items-center justify-center">
                <span class="text-[6px] font-black tracking-wider text-black">LYNE</span>
              </div>
            </div>
            <!-- Teal Checkmark Badge -->
            <div class="absolute bottom-1 right-1 w-4 h-4 rounded-full bg-[#00897B] flex items-center justify-center text-white">
              <svg class="w-2.5 h-2.5 stroke-current stroke-3 fill-none" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
          </div>

          <!-- Doc Metadata -->
          <div class="flex flex-col gap-1">
            <h3 class="text-sm font-semibold text-white tracking-tight">New Doc 11-09-2026 13.00</h3>
            <span class="text-xs text-slate-400">09/11/26 13:00</span>
            <div class="flex items-center gap-1.5 text-xs text-slate-400">
              <svg class="w-3.5 h-3.5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
                <rect x="5" y="5" width="13" height="13" rx="1.5"/>
                <path d="M8 5V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-2"/>
              </svg>
              <span>3</span>
            </div>
          </div>
        </div>

        <button class="text-slate-400 hover:text-white p-2">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
          </svg>
        </button>
      </div>

    </div>

  </div>

  <!-- Bottom Navigation Bar with Center Floating Camera FAB -->
  <nav class="fixed bottom-0 inset-x-0 bg-black/95 backdrop-blur-md border-t border-slate-900/60 pb-3 pt-2 px-8 flex items-center justify-around z-50 max-w-md mx-auto">
    <!-- Left: Documents Tab -->
    <button class="flex flex-col items-center gap-1 text-[#00BCD4] group">
      <svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      <span class="text-[11px] font-semibold">Documents</span>
    </button>

    <!-- Center: Elevated Circular Camera FAB -->
    <div class="relative -top-5">
      <button onclick="if(window.__TAURI__){window.__TAURI__.core.invoke('capture_photo')}else if(window.craftui_native){window.craftui_native.postMessage(JSON.stringify({cmd:'capture_photo'}))}" class="w-16 h-16 rounded-full bg-[#00897B] flex items-center justify-center text-white teal-glow hover:scale-105 active:scale-95 transition shadow-lg border-4 border-black">
        <svg class="w-7 h-7 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
    </div>

    <!-- Right: Tools Tab -->
    <button class="flex flex-col items-center gap-1 text-[#8E95A5] hover:text-white transition group">
      <svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewBox="0 0 24 24">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <span class="text-[11px] font-semibold">Tools</span>
    </button>
  </nav>

  <script>
    // Official Tauri 2.0 & CraftUI Hybrid IPC Bridge
    window.craftui = {
      invoke: function(cmd, args) {
        if (window.craftui_native && window.craftui_native.postMessage) {
          window.craftui_native.postMessage(JSON.stringify({ cmd: cmd, args: args || {} }));
        }
        return Promise.resolve();
      }
    };
    window.__TAURI__ = {
      core: {
        invoke: window.craftui.invoke
      }
    };
  </script>
</body>
</html>
