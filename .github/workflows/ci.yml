name: CraftUI CI

# Pull requests run the Tier 1 targets (Linux desktop, Web/WASM, Android).
# The slower and more expensive Windows and macOS runners only run on pushes
# to `main` and on manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  license-guard:
    name: License Purity (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  lockfile:
    name: Resolve Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile when it is not committed
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          wc -l Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libx11-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace
      - name: Minimal-feature compile check
        if: ${{ !cancelled() }}
        run: cargo check -p craftui --no-default-features --features "desktop,dsl,hot-reload,embedded-fallback-font,gpu-sdf"

  desktop-matrix:
    name: Test & Clippy (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo test --workspace

  wasm:
    name: Web WASM (clippy, minimal check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p craftui-platform-web --target wasm32-unknown-unknown -- -D warnings
      - name: Minimal-feature check
        if: ${{ !cancelled() }}
        run: cargo check -p craftui-platform-web --target wasm32-unknown-unknown --no-default-features --features gpu-sdf

  android:
    name: Android (clippy, minimal check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Point cargo at the preinstalled NDK
        run: |
          NDK_BIN="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android26-clang"
            echo "CXX_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android26-clang++"
            echo "AR_aarch64_linux_android=${NDK_BIN}/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_BIN}/aarch64-linux-android26-clang"
          } >> "$GITHUB_ENV"
      - name: Clippy
        run: cargo clippy -p craftui-platform-android --target aarch64-linux-android -- -D warnings
      - name: Minimal-feature check
        if: ${{ !cancelled() }}
        run: cargo check -p craftui-platform-android --target aarch64-linux-android --no-default-features --features gpu-sdf

  bench-smoke:
    name: Benchmark smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev libfreetype-dev libx11-dev
      - name: Run perf suite smoke benchmark
        run: |
          cargo bench -p craftui --bench perf_suite -- --quick --json > bench-smoke.json
          cat bench-smoke.json
          python3 -m json.tool bench-smoke.json > /dev/null
